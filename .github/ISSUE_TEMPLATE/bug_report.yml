name: Bug report
description: The PDF looks different from the browser, a conversion fails, or the package misbehaves
labels: [bug]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for reporting! The quickest fix comes from a small HTML document that shows the problem.
        Please remove anything private from it. For security issues, use the private report described in SECURITY.md instead.
  - type: textarea
    id: html
    attributes:
      label: HTML (and CSS) that shows the problem
      description: As small as possible. Attach images or files if they matter.
      render: html
    validations:
      required: true
  - type: textarea
    id: code
    attributes:
      label: JavaScript code and options
      render: js
      placeholder: |
        const { pdf } = await convert(html, { viewportWidth: 1280 });
  - type: textarea
    id: expected
    attributes:
      label: What you expected and what you got
      description: Screenshots of the browser and of the PDF help a lot.
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Package version
      placeholder: "0.1.0"
    validations:
      required: true
  - type: input
    id: environment
    attributes:
      label: Node.js version and operating system
      placeholder: "Node 22, Ubuntu 24.04 x64"
    validations:
      required: true
